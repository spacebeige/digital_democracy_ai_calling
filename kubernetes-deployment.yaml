# Kubernetes Deployment Configuration (Optional)
# For advanced production deployments using Kubernetes

---

# deployment.yaml - Kubernetes Deployment for Meera

apiVersion: apps/v1
kind: Deployment
metadata:
  name: meera-app
  namespace: default
  labels:
    app: meera
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: meera
  
  template:
    metadata:
      labels:
        app: meera
        version: v1
    
    spec:
      # Affinity - spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - meera
                topologyKey: kubernetes.io/hostname
      
      containers:
      - name: meera-app
        image: meera-app:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        # Environment variables
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: meera-secrets
              key: groq-api-key
        
        - name: SARVAM_API_KEY
          valueFrom:
            secretKeyRef:
              name: meera-secrets
              key: sarvam-api-key
        
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: meera-secrets
              key: database-url
        
        - name: REDIS_URL
          value: "redis://meera-redis:6379/0"
        
        - name: LOG_LEVEL
          value: "INFO"
        
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        
        # Resource limits
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Volume mounts
        volumeMounts:
        - name: output-volume
          mountPath: /app/outputs
        
        - name: config-volume
          mountPath: /app/awaaz
        
        - name: tmp-volume
          mountPath: /tmp
      
      # Volumes
      volumes:
      - name: output-volume
        persistentVolumeClaim:
          claimName: meera-output-pvc
      
      - name: config-volume
        configMap:
          name: meera-config
      
      - name: tmp-volume
        emptyDir: {}
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---

# service.yaml - Kubernetes Service

apiVersion: v1
kind: Service
metadata:
  name: meera-app
  namespace: default
  labels:
    app: meera
spec:
  type: LoadBalancer
  selector:
    app: meera
  
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---

# configmap.yaml - Configuration Map

apiVersion: v1
kind: ConfigMap
metadata:
  name: meera-config
  namespace: default
data:
  STT_CONFIDENCE_THRESHOLD: "0.3"
  STT_PRIMARY: "groq"
  TTS_PRIMARY: "groq"
  LOG_LEVEL: "INFO"
  CUDA_VISIBLE_DEVICES: ""
  OMP_NUM_THREADS: "1"

---

# secrets.yaml - Secrets (base64 encoded, use Sealed Secrets in production)

apiVersion: v1
kind: Secret
metadata:
  name: meera-secrets
  namespace: default
type: Opaque
data:
  groq-api-key: Z3NrX3lvdXJfa2V5X2hlcmU=  # base64 encoded
  sarvam-api-key: eW91cl9zYXJ2YW1fa2V5X2hlcmU=  # base64 encoded
  database-url: cG9zdGdyZXM6Ly9tZWVyYTptZWVyYTEyM0Bwb3N0Z3Jlczo1NDMyL2dyaWV2YW5jZXM=  # base64 encoded

---

# persistentvolumeclaim.yaml - PVC for outputs

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meera-output-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  
  resources:
    requests:
      storage: 10Gi
  
  storageClassName: standard

---

# hpa.yaml - Horizontal Pod Autoscaler

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meera-app-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meera-app
  
  minReplicas: 2
  maxReplicas: 10
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---

# ingress.yaml - Kubernetes Ingress

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meera-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - meera.example.com
    secretName: meera-tls-cert
  
  rules:
  - host: meera.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meera-app
            port:
              number: 8000

---

# DEPLOYMENT INSTRUCTIONS

# 1. Create namespace (optional)
# kubectl create namespace meera-system

# 2. Create secrets (update with real values)
# kubectl apply -f secrets.yaml

# 3. Create configmap
# kubectl apply -f configmap.yaml

# 4. Create PVC
# kubectl apply -f persistentvolumeclaim.yaml

# 5. Deploy application
# kubectl apply -f deployment.yaml

# 6. Expose service
# kubectl apply -f service.yaml

# 7. Setup ingress (requires ingress controller)
# kubectl apply -f ingress.yaml

# 8. Setup autoscaling
# kubectl apply -f hpa.yaml

# 9. Verify deployment
# kubectl get pods
# kubectl get svc
# kubectl get ingress

# 10. View logs
# kubectl logs -f deployment/meera-app

# 11. Port forward locally
# kubectl port-forward svc/meera-app 8000:8000
