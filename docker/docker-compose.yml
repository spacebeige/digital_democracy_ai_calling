version: "3.9"

services:

  backend:
    image: python:3.11-slim
    working_dir: /workspace/backend
    volumes:
      - ../:/workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - STT_API=http://stt:9000
      - TTS_API=http://tts:9001
      - LLM_API=http://llm:9002
    depends_on:
      - redis
      - vector_db
      - stt
      - tts
      - llm

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  vector_db:
    image: ghcr.io/qdrant/qdrant
    ports:
      - "6333:6333"

  stt:
    image: python:3.11-slim
    working_dir: /workspace/ai-services
    volumes:
      - ../:/workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn speech_to_text.whisper_server:app --host 0.0.0.0 --port 9000"
    ports:
      - "9000:9000"

  tts:
    image: python:3.11-slim
    working_dir: /workspace/ai-services
    volumes:
      - ../:/workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn text_to_speech.coqui_tts:app --host 0.0.0.0 --port 9001"
    ports:
      - "9001:9001"

  llm:
    image: python:3.11-slim
    working_dir: /workspace/ai-services
    volumes:
      - ../:/workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn llm.sarvam_client:app --host 0.0.0.0 --port 9002"
    ports:
      - "9002:9002"